<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magiczne Karty - Odgadnij Liczbę</title>
    <!-- Ładowanie Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ładowanie czcionek Inter oraz Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top center, #1e1b4b 0%, #090d16 55%, #020617 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        h1, .font-display {
            font-family: 'Poppins', sans-serif;
        }

        /* Płynne przejścia i animacje dla kart */
        .magic-card {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, border-color 0.25s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .magic-card:hover {
            transform: translateY(-4px);
        }

        .magic-card.is-selected {
            transform: translateY(-8px) scale(1.025);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.65), 0 0 22px rgba(255, 255, 255, 0.45);
            border-color: #ffffff !important;
        }

        /* Przyciski gry */
        .game-btn {
            transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        .game-btn:active {
            transform: translateY(2px) scale(0.98);
        }

        /* Animacja panelu wyniku */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(12px);
            }
            70% {
                transform: scale(1.02) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-between py-8 px-4 sm:px-6 lg:px-8">

    <!-- Główny kontener aplikacji -->
    <main class="w-full max-w-6xl mx-auto flex flex-col items-center">
        
        <!-- Nagłówek i instrukcja -->
        <header class="text-center max-w-2xl mb-8 sm:mb-10">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-white to-indigo-200 mb-4">
                Magiczne Karty
            </h1>
            <p class="text-slate-200 text-base sm:text-lg leading-relaxed bg-slate-900/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl border border-slate-800 shadow-xl">
                Pomyśl o dowolnej liczbie od <strong class="text-amber-300 font-bold">1 do 60</strong>. 
                Zaznacz <strong class="text-white underline decoration-amber-400 decoration-2 underline-offset-4">wszystkie karty</strong>, na których widzisz swoją liczbę, a następnie kliknij <strong class="text-emerald-400 font-bold">AKCEPTUJ</strong>.
            </p>
        </header>

        <!-- Kontener siatki na 6 kolorowych kart -->
        <section id="cards-grid" aria-label="Karty z liczbami" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 mb-9">
            <!-- Karty są generowane natychmiast przez skrypt poniżej -->
            <noscript>
                <div class="col-span-full text-center p-6 bg-red-950/60 border border-red-500/40 rounded-2xl text-red-200">
                    Do działania gry wymagana jest obsługa JavaScript w przeglądarce.
                </div>
            </noscript>
        </section>

        <!-- Przyciski akcji -->
        <section class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 mb-8 w-full">
            <button id="accept-btn" type="button" class="game-btn flex items-center justify-center gap-2.5 px-8 py-4 rounded-2xl bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 text-slate-950 font-display font-extrabold text-lg sm:text-xl tracking-wide shadow-[0_10px_25px_-5px_rgba(16,185,129,0.5)] border-b-4 border-emerald-800 cursor-pointer min-w-[190px]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
                AKCEPTUJ
            </button>

            <button id="reset-btn" type="button" class="game-btn flex items-center justify-center gap-2.5 px-7 py-4 rounded-2xl bg-gradient-to-b from-slate-700 to-slate-800 hover:from-slate-600 hover:to-slate-700 text-white font-display font-bold text-lg sm:text-xl tracking-wide shadow-lg border-b-4 border-slate-950 cursor-pointer min-w-[165px]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                RESETUJ
            </button>
        </section>

        <!-- Panel wyniku (domyślnie ukryty) -->
        <section id="result-panel" aria-live="polite" class="hidden w-full max-w-xl mb-6">
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950/90 to-slate-900 border-2 border-amber-400/70 p-6 sm:p-8 text-center shadow-2xl">
                <!-- Dekoracyjne poświaty -->
                <div class="absolute -top-20 -left-20 w-44 h-44 bg-amber-400/15 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-20 -right-20 w-44 h-44 bg-emerald-400/15 rounded-full blur-3xl pointer-events-none"></div>

                <p id="result-title" class="text-amber-300 font-semibold uppercase tracking-widest text-xs sm:text-sm mb-2">
                    Twoja pomyślana liczba to:
                </p>
                
                <div id="result-value" class="font-display text-6xl sm:text-7xl font-extrabold text-white drop-shadow-[0_4px_14px_rgba(251,191,36,0.45)] my-2">
                    <!-- Tutaj wyświetli się wynik -->
                </div>

                <div id="result-details" class="mt-4 inline-block px-4 py-2.5 rounded-xl bg-slate-950/75 border border-slate-800 text-slate-300 text-sm sm:text-base font-medium">
                    <!-- Tutaj wyświetli się lista wybranych kart lub komunikat -->
                </div>
            </div>
        </section>

    </main>

    <!-- Stopka -->
    <footer class="text-center text-slate-500 text-xs sm:text-sm mt-6">
        Kliknij karty, aby je zaznaczyć lub odznaczyć
    </footer>

    <!-- Skrypt wykonujący się bezpośrednio po wyrenderowaniu kontenera #cards-grid -->
    <script>
        (function initMagicCardsGame() {
            // Dane 6 kolorowych kart z dokładnymi zestawami liczb
            const cardsData = [
                {
                    id: 1,
                    name: 'Karta 1',
                    gradient: 'from-rose-600 via-red-600 to-rose-800',
                    borderDefault: 'border-rose-400/35',
                    badgeBg: 'bg-rose-950/60 text-rose-100',
                    numbers: [1, 11, 21, 31, 41, 51, 3, 13, 23, 33, 43, 53, 5, 15, 25, 35, 45, 55, 7, 17, 27, 37, 47, 57, 9, 19, 29, 39, 49, 59]
                },
                {
                    id: 2,
                    name: 'Karta 2',
                    gradient: 'from-sky-600 via-blue-600 to-indigo-800',
                    borderDefault: 'border-sky-400/35',
                    badgeBg: 'bg-blue-950/60 text-sky-100',
                    numbers: [2, 11, 22, 31, 42, 51, 3, 14, 23, 34, 43, 54, 6, 15, 26, 35, 46, 55, 7, 18, 27, 38, 47, 58, 10, 19, 30, 39, 50, 59]
                },
                {
                    id: 3,
                    name: 'Karta 3',
                    gradient: 'from-emerald-600 via-green-600 to-teal-800',
                    borderDefault: 'border-emerald-400/35',
                    badgeBg: 'bg-emerald-950/60 text-emerald-100',
                    numbers: [4, 13, 22, 31, 44, 53, 5, 14, 23, 36, 45, 54, 6, 15, 28, 37, 46, 55, 7, 20, 29, 38, 47, 60, 12, 21, 30, 39, 52]
                },
                {
                    id: 4,
                    name: 'Karta 4',
                    gradient: 'from-amber-500 via-orange-600 to-red-700',
                    borderDefault: 'border-amber-400/35',
                    badgeBg: 'bg-orange-950/60 text-amber-100',
                    numbers: [8, 13, 26, 31, 44, 57, 9, 14, 27, 40, 45, 58, 10, 15, 28, 41, 46, 59, 11, 24, 29, 42, 47, 60, 12, 25, 30, 43, 56]
                },
                {
                    id: 5,
                    name: 'Karta 5',
                    gradient: 'from-violet-600 via-purple-600 to-fuchsia-800',
                    borderDefault: 'border-purple-400/35',
                    badgeBg: 'bg-purple-950/60 text-purple-100',
                    numbers: [16, 21, 26, 31, 52, 57, 17, 22, 27, 48, 53, 58, 18, 23, 28, 49, 54, 59, 19, 24, 29, 50, 55, 60, 20, 25, 30, 51, 56]
                },
                {
                    id: 6,
                    name: 'Karta 6',
                    gradient: 'from-cyan-600 via-teal-600 to-sky-800',
                    borderDefault: 'border-cyan-400/35',
                    badgeBg: 'bg-cyan-950/60 text-cyan-100',
                    numbers: [32, 37, 42, 47, 52, 57, 33, 38, 43, 48, 53, 58, 34, 39, 44, 49, 54, 59, 35, 40, 45, 50, 55, 60, 36, 41, 46, 51, 56]
                }
            ];

            // Zbiór zaznaczonych ID kart
            const selectedIds = new Set();

            // Pobranie referencji do kontenerów
            const cardsGrid = document.getElementById('cards-grid');
            const acceptBtn = document.getElementById('accept-btn');
            const resetBtn = document.getElementById('reset-btn');
            const resultPanel = document.getElementById('result-panel');
            const resultTitle = document.getElementById('result-title');
            const resultValue = document.getElementById('result-value');
            const resultDetails = document.getElementById('result-details');

            // Zabezpieczenie / fallback na wypadek braku kontenera w DOM
            if (!cardsGrid) {
                console.error('Nie znaleziono kontenera #cards-grid w drzewie DOM.');
                return;
            }

            /**
             * Renderuje wszystkie 6 kart w kontenerze #cards-grid
             */
            function renderCards() {
                try {
                    const cardsHTML = cardsData.map((card) => {
                        const cellsHTML = card.numbers.map((num) => `
                            <div class="bg-white/15 hover:bg-white/25 rounded-lg py-2 px-0.5 font-display font-bold text-sm sm:text-base text-white shadow-inner">
                                ${num}
                            </div>
                        `).join('');

                        return `
                            <div id="magic-card-${card.id}"
                                 data-card-id="${card.id}"
                                 role="button"
                                 tabindex="0"
                                 aria-pressed="false"
                                 aria-label="${card.name}"
                                 class="magic-card relative rounded-3xl bg-gradient-to-br ${card.gradient} p-4 sm:p-5 border-2 ${card.borderDefault} shadow-xl cursor-pointer flex flex-col justify-between">
                                
                                <!-- Górny pasek karty -->
                                <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-white/20">
                                    <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${card.badgeBg}">
                                        ${card.name}
                                    </span>
                                    <div class="check-circle w-7 h-7 rounded-full bg-black/30 border-2 border-white/50 flex items-center justify-center transition-all duration-200">
                                        <svg class="check-mark w-4 h-4 text-slate-950 opacity-0 scale-50 transition-all duration-200" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>

                                <!-- Siatka 6 kolumn z liczbami (wszystkie liczby wyglądają identycznie) -->
                                <div class="grid grid-cols-6 gap-1.5 text-center">
                                    ${cellsHTML}
                                </div>
                            </div>
                        `;
                    }).join('');

                    cardsGrid.innerHTML = cardsHTML;
                } catch (err) {
                    console.error('Błąd podczas renderowania kart:', err);
                    cardsGrid.innerHTML = `
                        <div class="col-span-full text-center p-6 bg-red-950/70 border border-red-500/50 rounded-2xl text-red-200">
                            Wystąpił problem z wyświetleniem kart. Odśwież stronę, aby spróbować ponownie.
                        </div>
                    `;
                }
            }

            /**
             * Przełącza stan zaznaczenia wybranej karty
             */
            function toggleCardSelection(cardId) {
                const cardEl = document.getElementById(`magic-card-${cardId}`);
                if (!cardEl) return;

                const checkCircle = cardEl.querySelector('.check-circle');
                const checkMark = cardEl.querySelector('.check-mark');

                if (selectedIds.has(cardId)) {
                    selectedIds.delete(cardId);
                    cardEl.classList.remove('is-selected', 'ring-4', 'ring-white/80');
                    cardEl.setAttribute('aria-pressed', 'false');

                    if (checkCircle && checkMark) {
                        checkCircle.classList.remove('bg-white', 'border-white', 'scale-110');
                        checkCircle.classList.add('bg-black/30', 'border-white/50');
                        checkMark.classList.add('opacity-0', 'scale-50');
                        checkMark.classList.remove('opacity-100', 'scale-100');
                    }
                } else {
                    selectedIds.add(cardId);
                    cardEl.classList.add('is-selected', 'ring-4', 'ring-white/80');
                    cardEl.setAttribute('aria-pressed', 'true');

                    if (checkCircle && checkMark) {
                        checkCircle.classList.remove('bg-black/30', 'border-white/50');
                        checkCircle.classList.add('bg-white', 'border-white', 'scale-110');
                        checkMark.classList.remove('opacity-0', 'scale-50');
                        checkMark.classList.add('opacity-100', 'scale-100');
                    }
                }
            }

            /**
             * Oblicza sumę pierwszych liczb z zaznaczonych kart i prezentuje wynik
             */
            function showResult() {
                const chosenCards = cardsData.filter((card) => selectedIds.has(card.id));

                // Reset animacji panelu wyniku
                resultPanel.classList.remove('hidden', 'animate-pop-in');
                void resultPanel.offsetWidth; // Wymuszenie ponownego uruchomienia animacji CSS
                resultPanel.classList.add('animate-pop-in');

                if (chosenCards.length === 0) {
                    resultTitle.textContent = 'Uwaga';
                    resultValue.textContent = '—';
                    resultValue.classList.add('text-amber-300');
                    resultValue.classList.remove('text-white');
                    resultDetails.innerHTML = 'Nie wybrano żadnej karty! Zaznacz karty ze swoją liczbą.';
                } else {
                    // Sumowanie pierwszych elementów (card.numbers[0]) wybranych kart
                    const guessedNumber = chosenCards.reduce((acc, card) => acc + card.numbers[0], 0);
                    const chosenNames = chosenCards.map((card) => card.name).join(', ');

                    resultTitle.textContent = 'Twoja pomyślana liczba to:';
                    resultValue.textContent = guessedNumber;
                    resultValue.classList.remove('text-amber-300');
                    resultValue.classList.add('text-white');
                    resultDetails.innerHTML = `Wybrane karty: <strong class="text-amber-300 font-semibold">${chosenNames}</strong>`;
                }

                resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            /**
             * Resetuje grę do stanu początkowego
             */
            function resetGame() {
                selectedIds.clear();

                cardsData.forEach((card) => {
                    const cardEl = document.getElementById(`magic-card-${card.id}`);
                    if (cardEl) {
                        cardEl.classList.remove('is-selected', 'ring-4', 'ring-white/80');
                        cardEl.setAttribute('aria-pressed', 'false');

                        const checkCircle = cardEl.querySelector('.check-circle');
                        const checkMark = cardEl.querySelector('.check-mark');

                        if (checkCircle && checkMark) {
                            checkCircle.classList.remove('bg-white', 'border-white', 'scale-110');
                            checkCircle.classList.add('bg-black/30', 'border-white/50');
                            checkMark.classList.add('opacity-0', 'scale-50');
                            checkMark.classList.remove('opacity-100', 'scale-100');
                        }
                    }
                });

                resultPanel.classList.add('hidden');
                resultPanel.classList.remove('animate-pop-in');
                resultValue.textContent = '';
                resultDetails.innerHTML = '';
            }

            // Delegacja zdarzeń kliknięcia oraz obsługi klawiatury dla kart
            cardsGrid.addEventListener('click', (event) => {
                const cardEl = event.target.closest('[data-card-id]');
                if (cardEl) {
                    const cardId = Number(cardEl.getAttribute('data-card-id'));
                    toggleCardSelection(cardId);
                }
            });

            cardsGrid.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    const cardEl = event.target.closest('[data-card-id]');
                    if (cardEl) {
                        event.preventDefault();
                        const cardId = Number(cardEl.getAttribute('data-card-id'));
                        toggleCardSelection(cardId);
                    }
                }
            });

            // Obsługa przycisków Akceptuj i Resetuj
            if (acceptBtn) {
                acceptBtn.addEventListener('click', showResult);
            }

            if (resetBtn) {
                resetBtn.addEventListener('click', resetGame);
            }

            // Natychmiastowe wyrenderowanie kart po załadowaniu kontenera
            renderCards();
        })();
    </script>
</body>
</html>
